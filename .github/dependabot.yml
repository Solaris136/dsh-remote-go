version: 2
updates:
  # Shipped package dependencies (root workspace only). All dev dependencies and
  # lockfiles live here; no test fixture keeps its own lockfile any more.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native compiler: its npm package no longer ships the JavaScript compiler API that
      # scripts/build.mjs and scripts/check-architecture.mjs import (`ts.ScriptTarget`, `ts.createSourceFile`). Moving
      # the build to TypeScript 7 is a tooling migration of its own, so major updates stay parked (patches still flow).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
