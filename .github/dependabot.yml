version: 2
updates:
  # Shipped package dependencies (root workspace only). The lockfiles under
  # e2e/control and e2e/remote/embed-check belong to test fixtures, not to the
  # published package, so they are intentionally not tracked here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
