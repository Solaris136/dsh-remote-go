name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Repository conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint repository conventions
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Syntax check
        run: pnpm run check:syntax

      - name: Validate workflow YAML
        run: pnpm run check:workflows

      - name: Check PR title (Conventional Commits)
        # Dependabot PR titles are auto-generated and often exceed the 72-char
        # limit, so the bot is exempt from this human-facing convention.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild vendored ssh2 bundle
        run: pnpm run build:vendor

      # Coverage thresholds are platform-independent, so only ubuntu computes them.
      # Windows still runs the same unit suite: path and SSH-config handling is
      # OS-sensitive, and a Windows-only regression must not reach main.
      - name: Unit tests with coverage thresholds
        if: runner.os == 'Linux'
        run: pnpm run test:coverage

      - name: Unit tests
        if: runner.os == 'Windows'
        run: pnpm run test:unit

      # Simulated-remote integration/E2E. No external host or browser is needed,
      # so this runs in the same job instead of a second matrix.
      - name: Integration tests (simulated remote)
        run: node --test --test-concurrency=1 "test/integration/*.test.js" "test/integration/*.e2e.js"

  package:
    name: Publish artifact (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate bundle metadata and market index entry
        run: pnpm run market:check

      - name: Check file coverage
        run: pnpm run pack:check

      - name: Pack tarball
        run: pnpm pack --pack-destination artifacts

      - name: Validate packed tarball
        run: pnpm run pack:check:tarball

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
