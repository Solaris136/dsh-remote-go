name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint repository conventions
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Syntax check
        run: pnpm run check:syntax

      - name: Validate workflow YAML
        run: pnpm run check:workflows

      - name: Check PR title (Conventional Commits)
        # Dependabot PR titles are auto-generated and often exceed the 72-char
        # limit, so the bot is exempt from this human-facing convention.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

      - name: Rebuild vendored ssh2 bundle
        run: pnpm run build:vendor

      - name: Unit tests with coverage thresholds
        run: pnpm run test:coverage

      # Simulated-remote integration/E2E: no external host or browser is needed,
      # so it runs here instead of on its own runner.
      - name: Integration tests (simulated remote)
        run: node --test --test-concurrency=1 "test/integration/*.test.js" "test/integration/*.e2e.js"

      - name: Validate bundle metadata and market index entry
        run: pnpm run market:check

      - name: Check file coverage
        run: pnpm run pack:check

      - name: Pack and validate the tarball
        run: |
          pnpm pack --pack-destination artifacts
          pnpm run pack:check:tarball

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Tests (windows-latest, Node 24)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild vendored ssh2 bundle
        run: pnpm run build:vendor

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests (simulated remote)
        run: node --test --test-concurrency=1 "test/integration/*.test.js" "test/integration/*.e2e.js"
