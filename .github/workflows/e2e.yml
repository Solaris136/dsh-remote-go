name: Remote E2E

# Real end-to-end acceptance against an SSH-reachable test machine:
# control DSH (isolated DSH_HOME) → SSH → remote DSH bootstrap → loopback
# tunnel → headless Chrome renders the remote DSH inside the panel iframe,
# plus the publish-path test (tarball install into a clean profile).
#
# Required repository secrets:
#   E2E_SSH_PRIVATE_KEY  private key able to log in to the test machine
# Optional:
#   E2E_SSH_KNOWN_HOSTS  pre-pinned known_hosts line (otherwise ssh-keyscan is used)
#
# Test host: pass the `ssh_address` dispatch input, or configure the
# E2E_SSH_ADDRESS repository variable. No host is hardcoded in this workflow.
#
# This workflow is manual only: it depends on a real external host and is not
# part of the default push/PR gate.

on:
  workflow_dispatch:
    inputs:
      ssh_address:
        description: Test host address (IP or hostname); falls back to the E2E_SSH_ADDRESS repository variable
        required: false
        default: ''
      ssh_user:
        description: SSH user
        required: true
        default: ubuntu
      ssh_port:
        description: SSH port
        required: false
        default: '22'
      keep_artifacts:
        description: Keep E2E report/screenshots
        type: boolean
        default: true

concurrency:
  group: remote-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve test host
        id: target
        env:
          INPUT_SSH_ADDRESS: ${{ inputs.ssh_address }}
          VARIABLE_SSH_ADDRESS: ${{ vars.E2E_SSH_ADDRESS }}
        run: |
          set -euo pipefail
          SSH_ADDRESS="${INPUT_SSH_ADDRESS:-${VARIABLE_SSH_ADDRESS:-}}"
          if [ -z "$SSH_ADDRESS" ]; then
            echo "::error::No test host configured: pass the ssh_address input or set the E2E_SSH_ADDRESS repository variable"
            exit 1
          fi
          echo "ssh_address=$SSH_ADDRESS" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install isolated control DSH runtime
        run: pnpm --dir e2e/control add --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.1

      - name: Install this plugin into the control profile
        run: |
          mkdir -p e2e/control/bin
          printf '#!/usr/bin/env bash\nexec pnpm "$@"\n' > e2e/control/bin/pnpm
          chmod +x e2e/control/bin/pnpm
          DSH_HOME="$PWD/e2e/control/home" PATH="$PWD/e2e/control/bin:$PATH" \
            node e2e/control/node_modules/@deepseek-ai/dsh/lib/bin.js plugin --profile web add "$PWD"

      - name: Configure SSH access
        env:
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          SSH_ADDRESS: ${{ steps.target.outputs.ssh_address }}
          SSH_USER: ${{ inputs.ssh_user }}
          SSH_PORT: ${{ inputs.ssh_port }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Repository secret E2E_SSH_PRIVATE_KEY is required for this workflow"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$E2E_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${E2E_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$E2E_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -T 20 "$SSH_ADDRESS" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          cat > ~/.ssh/config <<EOF
          Host e2e-target
            HostName $SSH_ADDRESS
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run end-to-end suites
        env:
          E2E_SSH_ADDRESS: e2e-target
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm run test:e2e

      - name: Upload E2E evidence
        if: always() && inputs.keep_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e/artifacts/*.json
            e2e/artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload control DSH logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-dsh-logs
          path: e2e/control/logs/*
          if-no-files-found: ignore
          retention-days: 7
