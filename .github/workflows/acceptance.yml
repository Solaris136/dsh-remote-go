name: Acceptance E2E

# Real-environment acceptance, deliberately **off the PR gate**:
# - Web E2E: the packed plugin installs into an isolated `dsh web` profile and a
#   real Chrome renders its settings section in light and dark mode;
# - Desktop E2E: the official Electron desktop app on Windows installs the packed
#   plugin and renders the same section.
#
# Both suites drive real browsers, take minutes and are sensitive to runner load,
# so they run nightly and on demand. A red run is a signal to investigate, not a
# merge blocker; the PR gate is `.github/workflows/ci.yml` plus CodeQL.
#
# `DSH_E2E_STRICT=1` makes a missing harness/browser/app a hard failure, so
# provisioning drift can never silently turn a job into a no-op.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: acceptance-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nightly runs are still strict: a missing prerequisite must fail, never skip.
  DSH_E2E_STRICT: '1'
  # ~280 MB per run; the key is bumped manually when a new build is needed.
  DSH_DESKTOP_INSTALLER_URL: https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe

jobs:
  web:
    name: Web E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the DSH harness
        # Installed with npm, not `pnpm add --global --ignore-scripts`:
        # - the harness needs its native addon (`node-addon-require-builtin`), and
        #   `--ignore-scripts` skips building it, so `dsh` died with
        #   "Cannot find module .../require_builtin.node" on the first CI run;
        # - npm runs install scripts without pnpm 11's build-approval gate;
        # - a local directory means no global bin/PATH juggling either.
        run: |
          mkdir -p "${{ runner.temp }}/harness"
          cd "${{ runner.temp }}/harness"
          npm init -y >/dev/null
          npm install --no-fund --no-audit --loglevel=error @deepseek-ai/dsh@0.2.2-rc.1
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version

      - name: Report tool versions
        env:
          DSH_CLI_JS: ${{ runner.temp }}/harness/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          echo "node $(node --version), pnpm $(pnpm --version)"
          echo "dsh $(node "$DSH_CLI_JS" --version)"

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Report the browser version
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "chrome ${CHROME_PATH:-<not set>}"

      - name: Run the web E2E
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # The suite resolves the harness from this path, so no global bin is needed.
          DSH_CLI_JS: ${{ runner.temp }}/harness/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_WEB_E2E_ARTIFACTS: ${{ runner.temp }}/web-e2e-artifacts
        run: node --test test/integration/web.e2e.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: ${{ runner.temp }}/web-e2e-artifacts
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache the desktop installer
        # ~280 MB per run; the key is bumped manually when a new build is needed.
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\dsh-desktop-installer.exe
          key: dsh-desktop-installer-v1

      - name: Refuse to test a machine with a running instance
        shell: pwsh
        run: |
          $running = Get-Process -Name 'DeepSeek Harness' -ErrorAction SilentlyContinue
          if ($running) {
            $ids = ($running | Select-Object -ExpandProperty Id) -join ', '
            Write-Error "a DeepSeek Harness instance is already running (pid: $ids); a silent install/launch cannot be validated in that state"
            exit 1
          }
          Write-Host 'no running instance, safe to install'

      - name: Download the desktop installer
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'dsh-desktop-installer.exe'
          if (Test-Path $target) {
            $size = (Get-Item $target).Length
            if ($size -gt 100MB) {
              Write-Host "cached installer: $target ($([math]::Round($size / 1MB)) MB)"
              exit 0
            }
            Remove-Item $target -Force
          }
          Write-Host "downloading $env:DSH_DESKTOP_INSTALLER_URL"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:DSH_DESKTOP_INSTALLER_URL -OutFile $target -TimeoutSec 900
          $size = (Get-Item $target).Length
          if ($size -lt 100MB) { Write-Error "installer is suspiciously small: $size bytes"; exit 1 }
          Write-Host "downloaded $target ($([math]::Round($size / 1MB)) MB)"

      - name: Install the desktop app silently (bounded)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-desktop-installer.exe'

          function Find-HarnessExe {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              $env:PROGRAMFILES,
              ${env:ProgramFiles(x86)},
              $env:RUNNER_TEMP
            ) | Where-Object { $_ -and (Test-Path $_) }
            foreach ($root in $roots) {
              $hit = Get-ChildItem -LiteralPath $root -Filter 'DeepSeek Harness.exe' -Recurse -Depth 3 -File -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          function Show-Tree([string[]]$roots) {
            foreach ($root in $roots) {
              if (-not $root -or -not (Test-Path $root)) { continue }
              Write-Host "--- $root"
              Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Select-Object -First 20 |
                ForEach-Object { Write-Host "    $($_.Name)" }
            }
          }

          function Invoke-Installer([string[]]$arguments, [string]$label) {
            Write-Host "installing ($label): $installer $($arguments -join ' ')"
            # -WindowStyle Hidden matters here: the installer is a GUI binary, so without it every
            # attempt flashes a console window in the runner and on a developer machine.
            $proc = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru -WindowStyle Hidden
            $deadline = (Get-Date).AddMinutes(10)
            while (-not $proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
            $stalled = -not $proc.HasExited
            if ($stalled) {
              Write-Warning "installer still alive after 10 minutes ($label); terminating it"
              try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch { Write-Warning "kill failed: $_" }
            } else {
              Write-Host "installer exited with code $($proc.ExitCode) ($label)"
            }
            # The payload is extracted by a child process: poll for the binary.
            $searchDeadline = (Get-Date).AddMinutes(5)
            while ((Get-Date) -lt $searchDeadline) {
              $found = Find-HarnessExe
              if ($found) { return @{ exe = $found; stalled = $stalled; exit = $proc.ExitCode } }
              Start-Sleep -Seconds 5
            }
            return @{ exe = $null; stalled = $stalled; exit = $proc.ExitCode }
          }

          $result = Invoke-Installer @('/S') 'default per-user location'
          if (-not $result.exe) {
            Write-Warning 'no binary after the default /S install; retrying with /D='
            $fallback = Join-Path $env:RUNNER_TEMP 'dsh-desktop-install'
            $result = Invoke-Installer @('/S', "/D=$fallback") 'explicit /D= target'
          }

          if (-not $result.exe) {
            Write-Host '--- diagnostics: installer did not produce a binary'
            Write-Host "installer: $installer"
            Write-Host "stalled: $($result.stalled), exit code: $($result.exit)"
            Show-Tree @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:PROGRAMFILES, ${env:ProgramFiles(x86)}, $env:RUNNER_TEMP)
            Write-Error 'DeepSeek Harness.exe was not found after a bounded silent install'
            exit 1
          }

          $version = (Get-Item -LiteralPath $result.exe).VersionInfo.FileVersion
          Write-Host "app: $($result.exe)"
          Write-Host "file version: $version"
          Write-Host "installer stalled: $($result.stalled)"
          "DSH_DESKTOP_EXE=$($result.exe)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Report tool versions
        shell: pwsh
        run: |
          Write-Host "node $(node --version)"
          Write-Host "pnpm $(pnpm --version)"
          Write-Host "installer $env:DSH_DESKTOP_INSTALLER_URL"
          $exe = $env:DSH_DESKTOP_EXE
          Write-Host "app $exe"
          if (Test-Path $exe) { Write-Host "appVersion $((Get-Item -LiteralPath $exe).VersionInfo.FileVersion)" }

      - name: Run the desktop E2E
        env:
          DSH_DESKTOP_E2E_ARTIFACTS: ${{ runner.temp }}\desktop-e2e-artifacts
        run: node --test test/integration/desktop.e2e.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-failure
          path: ${{ runner.temp }}\desktop-e2e-artifacts
          if-no-files-found: warn
          retention-days: 14
