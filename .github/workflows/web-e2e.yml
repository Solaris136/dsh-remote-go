name: Web E2E

# Real-browser acceptance for **web compatibility of the Remote-hosts settings
# section**. Desktop is covered separately by `desktop-e2e.yml`.
#
# What it proves: the *packed* plugin artifact installs into an isolated `dsh web`
# profile (`file:…tgz`, not a `link:` to the working tree — a `files[]`/`exports`
# drift fails here instead of shipping), the shell renders the plugin's settings
# section, and every button label is legible (WCAG contrast >= 3, alpha/opacity
# aware, gradients refused) in light AND dark mode.
#
# Reliability contract (nightly + manual; not a required check):
# - `DSH_E2E_STRICT=1` makes a missing harness/browser/pnpm a hard failure, so
#   provisioning drift can never silently turn this job into a no-op;
# - no fixed sleeps: every wait is a bounded poll on state that changes;
# - on failure a screenshot + console/harness logs are uploaded;
# - the job name is fixed (no matrix) so the check context never drifts.
#
# This suite drives a real Chrome against a packed install and is sensitive to
# runner load, so it runs on a schedule instead of gating every PR. A red nightly
# run is a signal to investigate, not a merge blocker.
#
# `pnpm run verify` never needs a harness: there the same file skips prerequisites.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI is required-grade: a missing prerequisite must fail, never skip.
  DSH_E2E_STRICT: '1'

jobs:
  web-e2e:
    name: Web E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the DSH harness
        # Installed with npm, not `pnpm add --global --ignore-scripts`:
        # - the harness needs its native addon (`node-addon-require-builtin`), and
        #   `--ignore-scripts` skips building it, so `dsh` died with
        #   "Cannot find module .../require_builtin.node" on the first CI run;
        # - npm runs install scripts without pnpm 11's build-approval gate;
        # - a local directory means no global bin/PATH juggling either.
        run: |
          mkdir -p "${{ runner.temp }}/harness"
          cd "${{ runner.temp }}/harness"
          npm init -y >/dev/null
          npm install --no-fund --no-audit --loglevel=error @deepseek-ai/dsh@0.2.2-rc.1
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version

      - name: Report tool versions
        env:
          DSH_CLI_JS: ${{ runner.temp }}/harness/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          echo "node $(node --version), pnpm $(pnpm --version)"
          echo "dsh $(node "$DSH_CLI_JS" --version)"

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Report the browser version
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "chrome ${CHROME_PATH:-<not set>}"

      - name: Run the web E2E
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # The suite resolves the harness from this path, so no global bin is needed.
          DSH_CLI_JS: ${{ runner.temp }}/harness/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_WEB_E2E_ARTIFACTS: ${{ runner.temp }}/web-e2e-artifacts
        run: node --test test/integration/web.e2e.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: ${{ runner.temp }}/web-e2e-artifacts
          if-no-files-found: warn
          retention-days: 14
