name: Release

# Publishes the version in package.json when the `release` branch is pushed:
# runs the publish gate, packs and inspects the tarball, publishes to npm with
# OIDC trusted publishing (no long-lived token), then tags the commit and
# creates the GitHub Release. Re-runs are safe: a version that is already on
# npm is skipped instead of failing.

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_NAME: dsh-remote-go

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No registry-url on purpose: the npm CLI authenticates with the
      # workflow OIDC token (id-token: write above) instead of an auth token,
      # and package.json publishConfig names the registry.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild vendored ssh2 bundle and require a clean tree
        run: |
          pnpm run build:vendor
          git diff --exit-code -- vendor/

      # Same gate as the PR (lint + format + syntax + workflows + market + pack +
      # coverage floors + unit + integration). The previous release path ran only the
      # unit tests, so a release could ship code that the PR gate would have rejected.
      - name: Verify (same gate as CI)
        run: pnpm run verify

      - name: Read the version to release
        id: version
        run: echo "version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"

      - name: Check whether that version is already on npm
        id: published
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${{ steps.version.outputs.version }} is already published; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack tarball
        if: steps.published.outputs.published == 'false'
        run: pnpm pack --pack-destination artifacts

      - name: Validate packed tarball
        if: steps.published.outputs.published == 'false'
        run: pnpm run pack:check:tarball

      - name: Publish to npm
        if: steps.published.outputs.published == 'false'
        run: npm publish --access public

      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists"
          else
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} already exists"
          else
            mapfile -t ASSETS < <(ls artifacts/*.tgz 2>/dev/null || true)
            gh release create "${TAG}" "${ASSETS[@]}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${TAG}"
          fi
