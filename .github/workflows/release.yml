name: Release

# Publishes the version in package.json when the `release` branch is pushed:
# runs the publish gate, packs and inspects the tarball, publishes to npm with
# OIDC trusted publishing (no long-lived token), then tags the commit and
# creates the GitHub Release. Re-runs are safe: a version that is already on
# npm is skipped instead of failing.

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_NAME: dsh-remote-go
  # Same rule as the PR gate: a missing browser/harness fails the release, it does not skip
  # the E2E suites the PR was required to pass.
  DSH_E2E_STRICT: '1'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No registry-url on purpose: the npm CLI authenticates with the
      # workflow OIDC token (id-token: write above) instead of an auth token,
      # and package.json publishConfig names the registry.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild vendored ssh2 bundle and require a clean tree
        run: |
          pnpm run build:vendor
          git diff --exit-code -- vendor/

      - name: Resolve the DSH harness version
        id: harness-version
        # engines.dsh is the compatibility floor; the release verifies against exactly the
        # harness the PR gate and acceptance install.
        run: |
          version="$(node scripts/harness-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same harness install as the PR gate: npm, because the harness needs its native
      # addon built and npm runs install scripts without pnpm's build-approval gate.
      - name: Install the DSH harness
        env:
          DSH_HARNESS_VERSION: ${{ steps.harness-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harness"
          cd "$RUNNER_TEMP/harness"
          npm init -y >/dev/null
          npm install --no-fund --no-audit --loglevel=error "@deepseek-ai/dsh@$DSH_HARNESS_VERSION"
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      # The release gate is identical to the PR `Verify` job: the repository/coverage
      # checks, then both strict integration groups. It used to run only the unit tests.
      - name: Repository gate (same checks as the PR)
        run: pnpm run gate

      - name: Integration tests (no external harness, strict)
        run: pnpm run test:integration:local

      - name: Browser and harness E2E (strict)
        env:
          DSH_CLI_JS: ${{ runner.temp }}/harness/node_modules/@deepseek-ai/dsh/lib/bin.js
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm run test:integration:external

      - name: Read the version to release
        id: version
        run: echo "version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"

      - name: Check whether that version is already on npm
        id: published
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${{ steps.version.outputs.version }} is already published; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack tarball
        if: steps.published.outputs.published == 'false'
        run: pnpm pack --pack-destination artifacts

      - name: Validate packed tarball
        if: steps.published.outputs.published == 'false'
        run: pnpm run pack:check:tarball

      - name: Publish to npm
        if: steps.published.outputs.published == 'false'
        run: npm publish --access public

      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists"
          else
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} already exists"
          else
            mapfile -t ASSETS < <(ls artifacts/*.tgz 2>/dev/null || true)
            gh release create "${TAG}" "${ASSETS[@]}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${TAG}"
          fi
