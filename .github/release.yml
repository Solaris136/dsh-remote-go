# Release-notes configuration consumed by `.github/workflows/release.yml`
# (`gh release create --generate-notes`). Pull requests are grouped by label;
# anything unmatched lands in the last catch-all category.
#
# Keep the catch-all (`labels: ['*']`) last: GitHub assigns each change to the
# first category that matches.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能 / Features
      labels:
        - enhancement
        - feat
    - title: 缺陷修复 / Fixes
      labels:
        - bug
        - fix
    - title: 文档 / Documentation
      labels:
        - documentation
    - title: 依赖与 CI / Dependencies and CI
      labels:
        - dependencies
        - ci
    - title: 其他变更 / Other Changes
      labels:
        - '*'
